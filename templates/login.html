
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ScamShield AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="auth-page login-page">

    <div class="cyber-glow"></div>

    <div class="auth-container">

        <!-- BRAND LOGO -->
        <div class="login-brand">
            <div class="brand-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="1.8">
                    <path d="M12 2L20 5V11C20 16 16.5 20 12 22C7.5 20 4 16 4 11V5L12 2Z"/>
                    <rect x="9" y="10" width="6" height="6" rx="1"/>
                    <path d="M10 10V8.5a2 2 0 014 0V10"/>
                </svg>
            </div>

            <div>
                <h2>ScamShield <span>AI</span></h2>
                <p>AI Powered Scam & Fraud Detection Platform</p>
            </div>
        </div>

        <!-- LOGIN CARD -->
        <div class="card login-card">

            <h1>Welcome Back!</h1>
            <div class="title-line"></div>

            <p class="login-subtitle">Login to ScamShield AI</p>

            <!-- FLASH MESSAGES -->
            {% with messages = get_flashed_messages() %}
                {% for message in messages %}
                    <p class="flash-message">{{ message }}</p>
                {% endfor %}
            {% endwith %}

            <form method="POST">

                <!-- EMAIL -->
                <div class="input-group">

                    <svg viewBox="0 0 24 24" fill="none"
                         stroke="currentColor" stroke-width="2">
                        <rect x="3" y="5" width="18" height="14" rx="2"/>
                        <path d="M3 7L12 13L21 7"/>
                    </svg>

                    <input
                        type="email"
                        name="email"
                        placeholder="Email Address"
                        autocomplete="email"
                        required>
                </div>

                <!-- PASSWORD -->
                <div class="input-group">

                    <svg viewBox="0 0 24 24" fill="none"
                         stroke="currentColor" stroke-width="2">
                        <rect x="5" y="10" width="14" height="11" rx="2"/>
                        <path d="M8 10V7a4 4 0 018 0v3"/>
                    </svg>

                    <input
                        type="password"
                        name="password"
                        id="password"
                        placeholder="Password"
                        autocomplete="current-password"
                        required>

                    <button
                        type="button"
                        class="toggle-password"
                        onclick="togglePassword()"
                        aria-label="Show password">

                        <svg id="eyeIcon" viewBox="0 0 24 24"
                             fill="none" stroke="currentColor"
                             stroke-width="2">
                            <path d="M2 12S5.5 5 12 5s10 7 10 7-3.5 7-10 7S2 12 2 12Z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>

                    </button>
                </div>

                <!-- LOGIN BUTTON -->
                <button type="submit" class="login-button">

                    <svg viewBox="0 0 24 24" fill="none"
                         stroke="currentColor" stroke-width="2.5">
                        <path d="M10 17L15 12L10 7"/>
                        <path d="M15 12H3"/>
                        <path d="M12 3H19A2 2 0 0121 5V19A2 2 0 0119 21H12"/>
                    </svg>

                    Login
                </button>

            </form>

            <div class="login-footer">
                <p>
                    New User?
                    <a href="/register">Create Account</a>
                </p>

                <p>
                    <a href="/">← Back to Home</a>
                </p>
            </div>

        </div>
    </div>

    <!-- SHOW / HIDE PASSWORD -->
    <script>
        function togglePassword() {

            const password = document.getElementById("password");
            const eyeIcon = document.getElementById("eyeIcon");
            const toggleButton = document.querySelector(".toggle-password");

            if (password.type === "password") {

                password.type = "text";

                eyeIcon.innerHTML = `
                    <path d="M3 3L21 21"/>
                    <path d="M10.6 10.6A2 2 0 0013.4 13.4"/>
                    <path d="M9.9 5.2A10 10 0 0112 5c6.5 0 10 7 10 7a14 14 0 01-4 4.5"/>
                    <path d="M6.6 6.6C3.7 8.3 2 12 2 12s3.5 7 10 7c1.3 0 2.5-.3 3.6-.8"/>
                `;

                toggleButton.setAttribute("aria-label", "Hide password");

            } else {

                password.type = "password";

                eyeIcon.innerHTML = `
                    <path d="M2 12S5.5 5 12 5s10 7 10 7-3.5 7-10 7S2 12 2 12Z"/>
                    <circle cx="12" cy="12" r="3"/>
                `;

                toggleButton.setAttribute("aria-label", "Show password");
            }
        }
    </script>

</body>
</html>
